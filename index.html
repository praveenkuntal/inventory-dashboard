<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory & Analytics Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1557b0;
        }
        .section {
            margin-bottom: 25px;
        }
        h2 {
            font-size: 18px;
            color: #202124;
            margin-bottom: 12px;
            border-bottom: 2px solid #f1f3f4;
            padding-bottom: 6px;
        }
        .analytics-box {
            display: flex;
            justify-content: space-between;
            background: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            color: #174ea6;
            margin-bottom: 15px;
        }
        pre {
            background-color: #1e1e1e;
            color: #00ff66;
            padding: 15px;
            border-radius: 6px;
            font-size: 13px;
            overflow-x: auto;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MY Mini Project</h1>
        <p class="subtitle">Capstone Project: </p>
        <div class="form-group">
            <input type="text" id="productName" placeholder="Enter Product Name (e.g., Tablet)">
            <input type="number" id="productPrice" placeholder="Enter Price (e.g., 300)">
            <button onclick="addNewProduct()">Add Product</button>
        </div>
        <div class="section">
            <h2>📋 Processing Inventory Roster</h2>
            <pre id="rosterOutput">Initializing...</pre>
        </div>
        <div class="section">
            <h2>📊 Financial Analytics</h2>
            <div class="analytics-box">
                <span id="totalValueText">Total Inventory Value: $0</span>
            </div>
            <pre id="analyticsOutput">Loading analytics...</pre>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
